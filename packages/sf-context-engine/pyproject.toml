[project]
name = "sf-context-engine"
version = "0.1.0"
description = "Salesforce org context engine: metadata index + dependency graph, vector search, knowledge base and project memory."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sf_context_engine"]
